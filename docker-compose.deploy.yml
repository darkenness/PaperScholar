services:
  db:
    image: postgres:16-alpine
    container_name: paperscholar-db
    restart: always
    environment:
      POSTGRES_DB: paperscholar
      POSTGRES_USER: paperscholar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - paperscholar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperscholar -d paperscholar"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: paperscholar-redis
    restart: always
    volumes:
      - paperscholar_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: paperscholar-backend
    restart: always
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - paperscholar_uploads:/app/uploads
      - ./backend/data:/app/data:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
    container_name: paperscholar-frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ""
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

volumes:
  paperscholar_pgdata:
  paperscholar_redisdata:
  paperscholar_uploads:
