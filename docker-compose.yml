services:
  db:
    image: postgres:16-alpine
    container_name: paperscholar-db
    restart: always
    environment:
      POSTGRES_DB: paperscholar
      POSTGRES_USER: paperscholar
      POSTGRES_PASSWORD: paperscholar
    ports:
      - "5433:5432"  # 避免与 ai-empathy 项目冲突，使用 5433
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperscholar"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: paperscholar-redis
    restart: always
    ports:
      - "6380:6379"  # 避免与 ai-empathy 项目冲突，使用 6380
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: paperscholar-backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      # Docker networking overrides (env_file values would use localhost otherwise)
      DATABASE_URL: postgresql+asyncpg://paperscholar:paperscholar@db:5432/paperscholar
      REDIS_URL: redis://redis:6379/0
    volumes:
      - uploads:/app/uploads
      - ./backend/app:/app/app
      - ./backend/data:/app/data
      - ./backend/.env:/app/.env:ro
    command: sh -c "chmod +x /app/entrypoint.sh && /app/entrypoint.sh"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: paperscholar-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000

volumes:
  pgdata:
  uploads:
